name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  repo-protection-check:
    name: Repository Protection Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit license and source notices
        run: python3 scripts/repo_protection.py audit

  webapp-check:
    name: Webapp Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./webapp/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Lint
        run: npm run lint
        
      - name: Run Build
        run: npm run build

  server-check:
    name: Server PyTest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ./server/requirements-dev.txt
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          
      - name: Run tests
        run: pytest tests/

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [webapp-check, server-check]
    defaults:
      run:
        working-directory: ./webapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./webapp/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ./server/requirements-dev.txt

      - name: Install webapp dependencies
        run: npm ci

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../server/requirements-dev.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build webapp for E2E
        run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000

      - name: Run Playwright suite
        env:
          ECONNECT_SERVER_PYTHON: python
          ALLOW_INSECURE_HTTP: "1"
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            webapp/test-results
            webapp/playwright-report
          if-no-files-found: ignore
